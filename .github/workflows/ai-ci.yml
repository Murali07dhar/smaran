# Copy to .github/workflows/ai.yml (Claude 1 owns CI; the Integrator merges this job in).
name: ai-service
on:
  push:
    paths: ["services/ai/**"]
  pull_request:
    paths: ["services/ai/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/ai/requirements-dev.txt
      - run: pip install -r requirements.txt pytest ruff onnx onnxruntime matplotlib
      - run: ruff check .
      - run: python -m pytest
      - run: python scripts/demo_trigger_decay.py
      - name: openapi.json is current
        run: |
          python -c "import json; from app.main import create_app; json.dump(create_app(':memory:').openapi(), open('/tmp/o.json','w'), indent=2)"
          python - <<'EOF'
          import json
          a = json.load(open('openapi.json')); b = json.load(open('/tmp/o.json'))
          assert sorted(a['paths']) == sorted(b['paths']), 'openapi.json paths drifted'
          EOF
      - name: no secrets committed
        run: "! grep -rniE '(AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9]{20,})' app ml scripts tests"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t smaran-ai services/ai
