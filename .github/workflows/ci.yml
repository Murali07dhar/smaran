name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test-api:
    name: API lint + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            infra/requirements/dev.txt
            services/api/requirements.txt
      - name: Install
        run: |
          pip install -r services/api/requirements.txt -r infra/requirements/dev.txt
      - name: Lint (ruff)
        run: ruff check services/api mocks
      - name: Test (pytest)
        run: cd services/api && python -m pytest tests -q

  compose-config:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate base file
        run: docker compose -f infra/docker-compose.yml --env-file infra/.env.example config -q
      - name: Validate prod override
        run: |
          SMARAN_DOMAIN=example.org docker compose \
            -f infra/docker-compose.yml -f infra/docker-compose.prod.yml \
            --env-file infra/.env.example config -q

  web:
    name: Web lint + build (pnpm)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('pnpm-workspace.yaml') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present lint
      - run: pnpm -r --if-present test
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test:unit
      - run: pnpm -r --if-present build

  docker-build:
    name: Build image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [lint-test-api, compose-config]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: api, dir: services/api }
          - { service: ai, dir: services/ai }
          - { service: voice, dir: services/voice }
          - { service: patient-web, dir: apps/patient-web }
          - { service: caregiver-web, dir: apps/caregiver-web }
    steps:
      - uses: actions/checkout@v4
      - name: Check the service exists in this checkout
        id: exists
        run: |
          if [ -d "${{ matrix.dir }}" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::${{ matrix.dir }} not found, skipping"; fi
      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.present == 'true'
      - name: Build
        if: steps.exists.outputs.present == 'true'
        run: |
          cp infra/.env.example infra/.env
          docker compose -f infra/docker-compose.yml --env-file infra/.env build ${{ matrix.service }}
