name: voice-ci
on:
  push: { paths: ['packages/voice-i18n/**', 'services/voice/**', 'mocks/voice/**'] }
  pull_request: { paths: ['packages/voice-i18n/**', 'services/voice/**', 'mocks/voice/**'] }
jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --filter @smaran/voice-i18n...
      - run: pnpm --filter @smaran/voice-i18n typecheck
      - run: pnpm --filter @smaran/voice-i18n test
  py:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/voice } }
    env: { VOICE_MODELS_MODE: 'off', VOICE_REQUIRE_AUTH: 'false' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
