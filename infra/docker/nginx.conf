# Shared by patient-web and caregiver-web (nginx-unprivileged, listens on 8080).
# The SPA is served from /; /api/ and /ws/ are proxied to the api container so the browser
# sees ONE origin (no CORS, relative API base URL, works for the offline-first PWA).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;           # photo / audio uploads
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS; resolved lazily so nginx still starts if api is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # camera / microphone only for this origin (used after a ConsentRecord, in-app)
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    # D4: /api/v1/voice/* -> services/voice /voice/* (longest prefix wins over /api/).
    location /api/v1/voice/ {
        set $voice_upstream http://voice:8002;
        rewrite ^/api/v1/voice/(.*)$ /voice/$1 break;
        proxy_pass $voice_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        client_max_body_size 25m;       # ASR audio uploads
        proxy_read_timeout 60s;
    }

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location /ws/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Service worker and shell must never be cached stale (PWA updates)
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;   # SPA fallback
    }
}
